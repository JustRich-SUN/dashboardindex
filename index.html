<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 시장 대시보드</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a212b;
    --border: #2a3442;
    --text: #e6edf3;
    --muted: #8b98a8;
    --accent: #3b82f6;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0 auto 0 0; }
  button {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; font-size: 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  select { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px; font-size: 14px; }

  #grid {
    display: grid; gap: 12px; padding: 12px 16px 40px;
    grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  }
  @media (max-width: 700px) { #grid { grid-template-columns: 1fr; padding: 10px; } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .card-head .title { font-weight: 600; font-size: 14px; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-head button { padding: 3px 8px; font-size: 13px; }
  .card-body { position: relative; }
  .card-body iframe { width: 100%; border: 0; display: block; background: #fff; }
  .hint { padding: 6px 10px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
  .hint a { color: var(--accent); }
  .edit-only { display: none; }
  body.editing .edit-only { display: inline-block; }

  dialog { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; width: min(440px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog label { display: block; margin: 12px 0 4px; font-size: 13px; color: var(--muted); }
  dialog input { width: 100%; padding: 9px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>

<header>
  <h1>📊 내 시장 대시보드</h1>
  <select id="colsSelect" title="열 개수">
    <option value="1">1열</option>
    <option value="2">2열</option>
    <option value="3">3열</option>
    <option value="4">4열</option>
  </select>
  <button id="refreshAll">전체 새로고침</button>
  <button id="resetBtn" class="edit-only" title="화면에서 바꾼 내용을 지우고 파일의 기본 목록으로 되돌립니다">기본 목록으로 초기화</button>
  <button id="editToggle">편집</button>
  <button id="addBtn" class="primary">+ 사이트 추가</button>
</header>

<main id="grid"></main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dlgTitle" style="margin:0">사이트 추가</h3>
    <label>이름</label>
    <input id="fName" placeholder="예: 금값" required>
    <label>주소 (URL)</label>
    <input id="fUrl" type="url" placeholder="https://..." required>
    <label>높이 (px)</label>
    <input id="fHeight" type="number" min="150" max="1200" value="360">
    <div class="dlg-actions">
      <button type="button" id="cancelBtn">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<script>
/* ============================================================
   ★ 여기에 사이트를 추가/수정하면 기본 목록이 바뀝니다 ★
   (화면의 "+ 사이트 추가" 버튼으로도 추가할 수 있고,
    그렇게 추가한 목록은 이 브라우저에 저장돼요)
   아래는 예시이므로 본인 사이트 주소로 바꿔 쓰세요.
   ============================================================ */
const tv = (symbol) =>
  "https://s.tradingview.com/widgetembed/?symbol=" + encodeURIComponent(symbol) +
  "&interval=D&theme=dark&style=1&locale=kr&hide_side_toolbar=1&withdateranges=1";

// indexergo 시계열 주소 만들기: ix(detailId, 주기)  주기: "D"(일), "M"(월), 생략 가능
const ix = (id, frq) =>
  "https://www.indexergo.com/series/?detailId=" + id + (frq ? "&frq=" + frq : "");

const H = 480; // 카드 기본 높이(px). 카드별로 height를 따로 줄 수도 있어요.

const DEFAULT_SITES = [
  { name: "금",                 url: ix(24201, "D"), height: H },
  { name: "나스닥",             url: ix(23103),      height: H },
  { name: "코스피",             url: ix(20201, "D"), height: H },
  { name: "환율",               url: ix(10601, "D"), height: H },
  { name: "VIX",               url: ix(23111, "D"), height: H },
  { name: "하이일드 채권 스프레드", url: ix(13404, "D"), height: H },
  { name: "외국인 보유비율",      url: ix(20210, "D"), height: H },
  { name: "거래대금",           url: ix(20203, "D"), height: H },
  { name: "WTI",               url: ix(24101),      height: H },
  { name: "소비자물가지수",       url: ix(13100, "M"), height: H },
  { name: "기대인플레이션",       url: ix(10505),      height: H },
  { name: "미시간 기대인플레이션", url: ix(13109),      height: H },

  // 다른 사이트를 섞고 싶으면 이렇게 한 줄 추가:
  // { name: "이름", url: "https://...", height: H },
  // TradingView 차트: { name: "S&P 500", url: tv("SP:SPX"), height: 360 },
];

/* ---------- 이하 동작 코드 ---------- */
const KEY_SITES = "dash.sites.v1";
const KEY_COLS  = "dash.cols.v1";

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let sites = load(KEY_SITES, DEFAULT_SITES);
let editIndex = -1;

const grid = document.getElementById("grid");
const colsSelect = document.getElementById("colsSelect");

function applyCols() {
  const c = load(KEY_COLS, 2);
  colsSelect.value = String(c);
  grid.style.setProperty("--cols", c);
}

function render() {
  grid.innerHTML = "";
  if (!sites.length) {
    grid.innerHTML = '<div class="empty">사이트가 없어요. 오른쪽 위 "+ 사이트 추가"를 눌러보세요.</div>';
    return;
  }
  sites.forEach((s, i) => {
    const card = document.createElement("section");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "card-head";
    const title = document.createElement("span");
    title.className = "title";
    title.textContent = s.name;
    head.appendChild(title);

    const mk = (label, cls, fn, tip) => {
      const b = document.createElement("button");
      b.textContent = label; b.title = tip || "";
      if (cls) b.className = cls;
      b.onclick = fn;
      head.appendChild(b);
      return b;
    };
    mk("◀", "edit-only", () => move(i, -1), "앞으로");
    mk("▶", "edit-only", () => move(i, 1), "뒤로");
    mk("수정", "edit-only", () => openDialog(i));
    mk("삭제", "edit-only danger", () => remove(i));
    mk("↻", "", () => { iframe.src = s.url; }, "새로고침");
    mk("↗", "", () => window.open(s.url, "_blank", "noopener"), "새 탭에서 열기");

    const body = document.createElement("div");
    body.className = "card-body";
    const iframe = document.createElement("iframe");
    iframe.src = s.url;
    iframe.style.height = (s.height || 360) + "px";
    iframe.loading = "lazy";
    iframe.referrerPolicy = "no-referrer";
    iframe.title = s.name;
    body.appendChild(iframe);

    const hint = document.createElement("div");
    hint.className = "hint";
    const a = document.createElement("a");
    a.href = s.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "새 탭에서 열기";
    hint.append("화면이 비어 있으면 그 사이트가 삽입을 막은 거예요 → ", a);

    card.append(head, body, hint);
    grid.appendChild(card);
  });
}

function move(i, d) {
  const j = i + d;
  if (j < 0 || j >= sites.length) return;
  [sites[i], sites[j]] = [sites[j], sites[i]];
  save(KEY_SITES, sites); render();
}
function remove(i) {
  if (!confirm('"' + sites[i].name + '" 을(를) 삭제할까요?')) return;
  sites.splice(i, 1);
  save(KEY_SITES, sites); render();
}

/* 추가/수정 다이얼로그 */
const dlg = document.getElementById("dlg");
const fName = document.getElementById("fName");
const fUrl = document.getElementById("fUrl");
const fHeight = document.getElementById("fHeight");

function openDialog(i) {
  editIndex = i;
  const s = i >= 0 ? sites[i] : { name: "", url: "", height: 360 };
  document.getElementById("dlgTitle").textContent = i >= 0 ? "사이트 수정" : "사이트 추가";
  fName.value = s.name; fUrl.value = s.url; fHeight.value = s.height || 360;
  dlg.showModal();
}
document.getElementById("addBtn").onclick = () => openDialog(-1);
document.getElementById("cancelBtn").onclick = () => dlg.close();
document.getElementById("form").addEventListener("submit", () => {
  const item = { name: fName.value.trim(), url: fUrl.value.trim(), height: Number(fHeight.value) || 360 };
  if (editIndex >= 0) sites[editIndex] = item; else sites.push(item);
  save(KEY_SITES, sites); render();
});

/* 기타 버튼 */
document.getElementById("editToggle").onclick = (e) => {
  document.body.classList.toggle("editing");
  e.target.textContent = document.body.classList.contains("editing") ? "편집 끝" : "편집";
};
document.getElementById("refreshAll").onclick = () => {
  document.querySelectorAll("iframe").forEach(f => { const s = f.src; f.src = s; });
};
document.getElementById("resetBtn").onclick = () => {
  if (!confirm("화면에서 추가/수정/순서변경한 내용을 지우고 기본 목록으로 되돌릴까요?")) return;
  try { localStorage.removeItem(KEY_SITES); } catch (e) {}
  sites = DEFAULT_SITES.slice();
  render();
};
colsSelect.onchange =() => { save(KEY_COLS, Number(colsSelect.value)); applyCols(); };

applyCols();
render();
</script>
</body>
</html>
